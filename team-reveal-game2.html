<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Find Your Team — Game 2 · Shikha &amp; Divy's Diwali Party</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #22060a;
        --bg2: #35090f;
        --panel: #3d0d16;
        --panel2: #4a1220;
        --gold: #e9b949;
        --gold-bright: #ffd970;
        --cream: #fdf3d8;
        --cream-dim: #d9c9a3;
        --marigold: #ff8c42;
        --pink: #ff5d7e;
        --green: #7fd08c;
        --line: rgba(233, 185, 73, 0.35);
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Mukta", system-ui, sans-serif;
        color: var(--cream);
        background:
          radial-gradient(1200px 600px at 50% -10%, rgba(255, 140, 66, 0.22), transparent 60%),
          linear-gradient(180deg, var(--bg2), var(--bg));
        min-height: 100vh;
      }
      .toran {
        height: 14px;
        background-image:
          radial-gradient(circle at 8px 6px, #ffb347 5px, transparent 6px),
          radial-gradient(circle at 26px 8px, #ff7847 5px, transparent 6px),
          radial-gradient(circle at 44px 6px, #7fb069 4px, transparent 5px);
        background-size: 54px 14px;
        background-repeat: repeat-x;
        opacity: 0.9;
      }
      .wrap { max-width: 720px; margin: 0 auto; padding: 20px 18px 48px; text-align: center; }
      h1 { font-family: "Rozha One", serif; color: var(--gold-bright); font-size: clamp(30px, 7vw, 46px); margin: 10px 0 4px; line-height: 1.1; }
      .sub { color: var(--cream-dim); font-size: 18px; margin: 0 0 6px; }
      .step { color: var(--gold); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 13px; margin: 22px 0 10px; }
      .grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      button.choice {
        font-family: "Mukta", system-ui, sans-serif;
        font-size: 18px; font-weight: 700;
        color: var(--cream);
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 12px 20px;
        cursor: pointer;
        box-shadow: var(--shadow);
      }
      button.choice:active { transform: scale(0.97); background: var(--panel); }
      button.choice.mithai { font-size: 20px; padding: 14px 24px; border-color: var(--gold); }
      .picked { font-size: 20px; color: var(--cream-dim); margin: 8px 0 0; }
      .picked b { color: var(--cream); }
      .reveal-card {
        background: var(--panel);
        border: 2px solid var(--gold);
        border-radius: 20px;
        padding: 28px 20px;
        margin-top: 18px;
        box-shadow: var(--shadow);
      }
      .reveal-card .you { font-size: 20px; color: var(--cream-dim); }
      .reveal-card .team {
        font-family: "Rozha One", serif;
        font-size: clamp(38px, 10vw, 60px);
        color: var(--gold-bright);
        line-height: 1.05;
        margin: 6px 0;
      }
      .reveal-card .mates { font-size: 19px; line-height: 1.7; margin: 10px 0 0; }
      .reveal-card .mates b { color: var(--gold-bright); }
      .flex-note { font-size: 16px; color: var(--cream-dim); margin-top: 12px; }
      button.next {
        margin-top: 22px;
        font-family: "Mukta", system-ui, sans-serif;
        font-size: 18px; font-weight: 800;
        color: #22060a;
        background: var(--gold);
        border: none;
        border-radius: 999px;
        padding: 13px 26px;
        cursor: pointer;
      }
      button.ghost {
        margin-top: 14px;
        font-family: "Mukta", system-ui, sans-serif;
        font-size: 15px; font-weight: 700;
        color: var(--cream-dim);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 9px 18px;
        cursor: pointer;
      }
      .hidden { display: none; }
      .foot { margin-top: 34px; font-size: 14px; color: var(--cream-dim); }
    </style>
  </head>
  <body>
    <div class="toran"></div>
    <div class="wrap">
      <h1>🪔 Find Your Team!</h1>
      <p class="sub">Shikha &amp; Divy's Diwali Party · Game 2 — Jumbled Words</p>

      <!-- Step 1: pick your name -->
      <div id="step-names">
        <p class="step">Step 1 · Tap your name</p>
        <div class="grid" id="name-grid"></div>
      </div>

      <!-- Step 2: pick a mithai (theatre — any pick reveals your pre-decided team) -->
      <div id="step-mithai" class="hidden">
        <p class="step">Step 2 · Pick your mithai</p>
        <p class="picked">Hi <b id="picked-name"></b>! One last thing…</p>
        <div class="grid" id="mithai-grid" style="margin-top:14px"></div>
        <br />
        <button class="ghost" id="back-names">← Not me, go back</button>
      </div>

      <!-- Step 3: reveal -->
      <div id="step-reveal" class="hidden">
        <div class="reveal-card">
          <div class="you"><span id="reveal-name"></span>, you're on…</div>
          <div class="team">Team <span id="reveal-team"></span> 🎉</div>
          <p class="mates">Your teammates:<br /><span id="reveal-mates"></span></p>
          <p class="flex-note hidden" id="reveal-flex"></p>
        </div>
        <button class="next" id="next-guest">Done — next guest →</button>
      </div>

      <p class="foot">Head to the game area and find your team-mates — the words start soon! 🔤</p>
    </div>

    <script>
      // Game 2 rosters (Jumbled Words) — fresh shuffle by Shikha on Nov 21, 2026
      // (29 guests, 6 teams). Same rules as game 1, plus nobody shares a team
      // with anyone from their game-1 team. No flex players in game 2.
      // Jigar (Janal's partner) and Jiger (Dhara's partner) are different
      // people and are labelled by partner.
      var TEAMS = {
        "Ladoo":       ["Kush", "Meet", "Pankaj", "Hemangini", "Neel"],
        "Barfi":       ["Janal's dad", "Neha", "Jiger (Dhara's partner)", "Harsh", "Mayank"],
        "Jalebi":      ["Dipti", "Dhara", "Janal's mom", "Avanthi", "Janal"],
        "Kaju Katli":  ["Arjun", "Naisargi", "Tapan", "Mitwa", "Rushil"],
        "Rasgulla":    ["Jigar (Janal's partner)", "Yash", "Mrugesh", "Bhavik", "Swara"],
        "Gulab Jamun": ["Radhika", "Jyothsna", "Varun", "Krinal"]
      };
      var FLEX = {};
      var MITHAI = ["Ladoo", "Barfi", "Jalebi", "Kaju Katli", "Rasgulla", "Gulab Jamun"];

      var teamOf = {};
      Object.keys(TEAMS).forEach(function (team) {
        TEAMS[team].forEach(function (name) { teamOf[name] = team; });
      });

      var currentName = null;
      var $ = function (id) { return document.getElementById(id); };

      function show(id) {
        ["step-names", "step-mithai", "step-reveal"].forEach(function (s) {
          $(s).classList.toggle("hidden", s !== id);
        });
        window.scrollTo(0, 0);
      }

      // Step 1: name grid (alphabetical, so no team order leaks)
      var names = Object.keys(teamOf).sort();
      names.forEach(function (name) {
        var b = document.createElement("button");
        b.className = "choice";
        b.textContent = name;
        b.onclick = function () {
          currentName = name;
          $("picked-name").textContent = name;
          show("step-mithai");
        };
        $("name-grid").appendChild(b);
      });

      // Step 2: mithai grid — the pick is theatre; the team is pre-decided.
      MITHAI.forEach(function (m) {
        var b = document.createElement("button");
        b.className = "choice mithai";
        b.textContent = m;
        b.onclick = function () { reveal(); };
        $("mithai-grid").appendChild(b);
      });

      $("back-names").onclick = function () { currentName = null; show("step-names"); };
      $("next-guest").onclick = function () { currentName = null; show("step-names"); };

      function reveal() {
        var team = teamOf[currentName];
        var mates = TEAMS[team].filter(function (n) { return n !== currentName; });
        $("reveal-name").textContent = currentName;
        $("reveal-team").textContent = team;
        $("reveal-mates").innerHTML = mates.map(function (n) {
          return "<b>" + n + "</b>";
        }).join(" · ");
        var flex = $("reveal-flex");
        if (FLEX[currentName]) {
          flex.textContent = FLEX[currentName];
          flex.classList.remove("hidden");
        } else {
          flex.classList.add("hidden");
        }
        show("step-reveal");
      }
    </script>
  </body>
</html>
